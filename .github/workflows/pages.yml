# Build the Atari816 manual (sdk/tools/mkmanual.py: the Markdown sources -> HTML) and
# publish it to GitHub Pages. The site holds only the pages listed in mkmanual.py's
# MANIFEST; the HTML is never committed.
#
# One-time repository setting: Settings -> Pages -> Source = "GitHub Actions".
name: Publish the manual

on:
  push:
    branches: [main]
    paths:
      - '**.md'
      - 'Docs/**'
      - 'sdk/tools/mkmanual.py'
      - 'sdk/tools/manual/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build the site (standard library only) and check its links
        run: python3 sdk/tools/mkmanual.py -o _site --check
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
