# Horizon program: o65 (ld65 "small" o65, 16-bit sizes). Linked at bank 0 $0100, which is
# where the loader puts text+data+bss in the task's code bank (zp at $0000 = the task's
# direct page). The loader relocates every 16-bit address and bank byte anyway.
MEMORY {
    ZP:   start = $0000, size = $0100, type = rw;
    MAIN: start = $0100, size = $FF00, file = %O;
}
FILES {
    %O: format = o65;
}
SEGMENTS {
    ZEROPAGE: load = ZP,   type = zp;
    CODE:     load = MAIN, type = ro;
    RODATA:   load = MAIN, type = ro;
    DATA:     load = MAIN, type = rw;
    BSS:      load = MAIN, type = bss;
}
FORMATS {
    o65: os = cc65, type = small;
}
