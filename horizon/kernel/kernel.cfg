# Horizon kernel image: loaded by the I/O processor at $01:0000 (it reads at most $FF00 bytes).
# BSS follows the image in the same bank and is cleared at boot.
# BSS2: more variables past the video-state block ($01:F400-$FFEF), cleared at boot too.
# VSTATE: the video-state block at the fixed address $01:F000 (ABI.md, "Video state").
# (0.18) K2: the kernel's second code segment (kernel/k2.s, its own assembly unit), run from
# bank 0 $E100-$FEFF (write-protected by FR_CTRL.WP_VEC, readable only by the kernel). In the
# file it follows the bank $01 image, so the I/O processor loads it at $01:__BSS_RUN__; boot
# copies it to $00:E100 before it clears the BSS over it. K0: its variables in bank 0
# $A300-$AFFF (between the kernel stacks and the mailbox rings; long addressing only).
MEMORY {
    KIMG: start = $010000, size = $F000, file = %O, fill = no;
    K2:   start = $00E100, size = $1E00, file = %O, fill = no;
    VST:  start = $01F000, size = $0400, file = "";
    HI:   start = $01F400, size = $0BF0, file = "";
    K0:   start = $00A300, size = $0D00, file = "";
}
SEGMENTS {
    CODE:   load = KIMG, type = rw;
    RODATA: load = KIMG, type = ro;
    BSS:    load = KIMG, type = bss, define = yes;
    K2CODE: load = K2, type = ro, define = yes;
    K2DATA: load = K2, type = ro, define = yes;
    VSTATE: load = VST, type = bss;
    BSS2:   load = HI, type = bss, define = yes;
    K0BSS:  load = K0, type = bss, define = yes;
}
