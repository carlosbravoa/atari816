# ld65 config for a cc65 C program under Horizon: one o65 "small" program, as user/prog.cfg.
# text/data/bss from $0100 of the code bank, zp (cc65's zero page) at window $0000 = the
# direct page. The C stack starts at the top of the code bank (crt0.s); __STACKSIZE__ only
# bounds the heap (malloc grows from the end of bss up to c_sp - __STACKSIZE__).
SYMBOLS {
    __STACKSIZE__: type = weak, value = $1000;
}
MEMORY {
    ZP:   start = $0000, size = $0100, type = rw;
    MAIN: start = $0100, size = $FF00, file = %O;
}
FILES {
    %O: format = o65;
}
SEGMENTS {
    ZEROPAGE: load = ZP,   type = zp;
    STARTUP:  load = MAIN, type = ro;
    LOWCODE:  load = MAIN, type = ro, optional = yes;
    ONCE:     load = MAIN, type = ro, optional = yes;
    CODE:     load = MAIN, type = ro;
    RODATA:   load = MAIN, type = ro;
    DATA:     load = MAIN, type = rw;
    BSS:      load = MAIN, type = bss, define = yes;
    HEAPSTART: load = MAIN, type = bss, optional = yes;   # (rt/_heap.s) the heap starts here
}
FEATURES {
    CONDES: type    = constructor,
            label   = __CONSTRUCTOR_TABLE__,
            count   = __CONSTRUCTOR_COUNT__,
            segment = ONCE;
    CONDES: type    = destructor,
            label   = __DESTRUCTOR_TABLE__,
            count   = __DESTRUCTOR_COUNT__,
            segment = RODATA;
    CONDES: type    = interruptor,
            label   = __INTERRUPTOR_TABLE__,
            count   = __INTERRUPTOR_COUNT__,
            segment = RODATA,
            import  = __CALLIRQ__;
}
FORMATS {
    o65: os = cc65, type = small;
}
