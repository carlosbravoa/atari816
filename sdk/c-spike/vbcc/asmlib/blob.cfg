# ld65 config for blob.s + ulib.o: o65 at code bank $0100 (the start of a vbcc program's
# text), ulib's zero page at $50 (above vbcc's registers), fixed: no zp relocation needed.
MEMORY {
    ZP:   start = $0050, size = $00B0, type = rw;
    MAIN: start = $0100, size = $FF00, file = %O;
}
FILES {
    %O: format = o65;
}
SEGMENTS {
    ZEROPAGE: load = ZP,   type = zp;
    BLOBHDR:  load = MAIN, type = ro;
    CODE:     load = MAIN, type = ro;
    RODATA:   load = MAIN, type = ro;
    DATA:     load = MAIN, type = rw;
    BSS:      load = MAIN, type = bss;
}
FORMATS {
    o65: os = cc65, type = small;
}
