# blob.cfg - ld65 configuration of the controls library's block for a C program (hcc,
# tools/hzc.py ui_block): o65, linked at $0100 of the code bank (the start of the C
# program's text), its zero page fixed at $50-$EF: above vbcc's registers ($00-$4F), below
# the float library's ($F0-$FF). The direct page is the task window's $0000 (D = 0), the
# same in every task: zero-page addresses need no relocation.
MEMORY {
    ZP:   start = $0050, size = $00A0, type = rw, define = yes;
    MAIN: start = $0100, size = $FF00, file = %O;
}
FILES {
    %O: format = o65;
}
SEGMENTS {
    ZEROPAGE: load = ZP,   type = zp;
    ZPEND:    load = ZP,   type = zp;
    BLOBHDR:  load = MAIN, type = ro;
    CODE:     load = MAIN, type = ro;
    RODATA:   load = MAIN, type = ro;
    DATA:     load = MAIN, type = rw;
    BSS:      load = MAIN, type = bss;
}
FORMATS {
    o65: os = cc65, type = small;
}
