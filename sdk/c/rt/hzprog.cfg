# hzprog.cfg - ld65 configuration of a Horizon program built with cc816 (hcc --cc cc816).
#
# An o65 file ("small": 16-bit sizes) linked at $0100: the loader puts text + data + bss
# there in the task's code bank and relocates every 16-bit address and bank byte. The
# startup (crt0.o, segment STARTUP) is first: Horizon enters the program at $0100.
#
# The code bank: code, constants, data, bss from $0100, then the heap, then the software
# stack (__HZ_SSTACK__ bytes, hcc --stack N) up to $FFF0. MAIN is what is left for the
# program itself; ld65 says by how much a program overflows it, and hcc turns that into
# the sizes (tools/hzc816.py).
#
# The direct page (ZP) is the window's $0000-$00FF (D = 0): cc816's registers (crt0.s),
# and the controls library's and ulib's when a program uses hui.h. hcc defines
# __HZ_SSTACK__ and __HZ_PAINT__ (--debug) with ld65 -D.
SYMBOLS {
    __HZ_SSTACK__: type = weak, value = $2000;
    __HZ_PAINT__:  type = weak, value = 0;
}
MEMORY {
    ZP:   start = $0000, size = $0100, type = rw;
    MAIN: start = $0100, size = $FFF0 - $0100 - __HZ_SSTACK__, file = %O;
}
FILES {
    %O: format = o65;
}
SEGMENTS {
    ZEROPAGE: load = ZP,   type = zp;
    ZPEND:    load = ZP,   type = zp, optional = yes;
    STARTUP:  load = MAIN, type = ro;
    CODE:     load = MAIN, type = ro;
    RODATA:   load = MAIN, type = ro;
    DATA:     load = MAIN, type = rw;
    BSS:      load = MAIN, type = bss, define = yes;
    HEAPSTART: load = MAIN, type = bss;
}
FEATURES {
    CONDES: type = constructor, label = __CONSTRUCTOR_TABLE__,
            count = __CONSTRUCTOR_COUNT__, segment = RODATA;
    CONDES: type = destructor, label = __DESTRUCTOR_TABLE__,
            count = __DESTRUCTOR_COUNT__, segment = RODATA;
}
FORMATS {
    o65: os = cc65, type = small;
}
